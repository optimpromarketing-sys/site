<script>(function(){
  window.opLb=function(card){var img=card.querySelector('.op-cert-thumb');if(!img)return;var lb=document.getElementById('op-lb');var lbi=document.getElementById('op-lb-img');if(lb&&lbi){lbi.src=img.src;lb.classList.add('is-open');}};
  document.addEventListener('keydown',function(e){if(e.key==='Escape'){var lb=document.getElementById('op-lb');if(lb)lb.classList.remove('is-open');}});
})();
(function(){
  var root=document.getElementById('op-block-08');
  if(!root)return;
  var els=root.querySelectorAll('.op-rv');
  if(!els.length)return;
  if('IntersectionObserver' in window){
    root.classList.add('op-js');
    els.forEach(function(el){var r=el.getBoundingClientRect();if(r.top<window.innerHeight&&r.bottom>0)el.classList.add('is-v');});
    var io=new IntersectionObserver(function(ee){ee.forEach(function(e){if(e.isIntersecting){e.target.classList.add('is-v');io.unobserve(e.target);}});},{threshold:0,rootMargin:'0px 0px -60px 0px'});
    els.forEach(function(el){if(!el.classList.contains('is-v'))io.observe(el);});
    setTimeout(function(){els.forEach(function(el){el.classList.add('is-v');});},3000);
  }
})();</script>
